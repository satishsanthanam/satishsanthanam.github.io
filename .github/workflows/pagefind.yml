name: Deploy NCERT Calibre Notes to Pages

on:
  push:
    branches: ["develop", "main"] # Adjust based on your staging branch
  workflow_dispatch:

# 💡 FIX 1: Cancel any in-progress runs of the same workflow to prevent duplicate artifacts
concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # (Your compilation/Pagefind search indexing steps here)

      # 💡 FIX 2: Ensure this step has a unique path and only triggers once
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Point this to the root directory where your HTML/style.css lives
          path: '.' 

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 💡 FIX 3: Keep using v4, but now it will only find 1 clean artifact
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
