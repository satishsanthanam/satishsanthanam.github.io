name: Deploy NCERT Calibre Notes to Pages

on:
  push:
    branches: ["main"] # 🎯 Only triggers execution when staging merges directly into main
  workflow_dispatch:

# Automatically cancels any older overlapping builds if you execute back-to-back commits
concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '24' # 🚀 Forces the stable Node 24 runtime to clear the deprecation warning

      - name: Install Dependencies & Build Search Index
        run: |
          npm install pagefind
          npx pagefind --site "."

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Safely packages the root layout directory along with the 'pagefind/' database

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
