<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Build Calibre — Global Curriculum Search</title>
  
  <link href="pagefind/pagefind-ui.css" rel="stylesheet">
  <script src="pagefind/pagefind-ui.js"></script>
  
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      margin: 0;
      padding: 0;
    }
    .search-container {
      max-width: 800px;
      margin: 40px auto;
      padding: 24px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
    }
    .nav-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 16px;
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      padding: 8px 16px;
      background-color: #f1f5f9;
      color: #334155;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 500;
      border: 1px solid #cbd5e1;
      transition: all 0.2s ease;
    }
    .btn-home:hover {
      background-color: #e2e8f0;
      border-color: #94a3b8;
    }
    h2 {
      margin: 0;
      color: #0f172a;
      font-size: 1.5rem;
    }
    
    /* 🎨 Pagefind UI Custom Theme Overrides to Match Your Staging Look */
    :root {
      --pagefind-ui-primary: #3182ce;
      --pagefind-ui-text: #1e293b;
      --pagefind-ui-background: #ffffff;
      --pagefind-ui-border: #cbd5e1;
      --pagefind-ui-tag: #edf2f7;
      --pagefind-ui-border-radius: 8px;
    }
    #search {
      width: 100%;
    }
    /* Defensive margin styling for the generated results pool */
    .pagefind-ui__result-link {
      color: #2b6cb0 !important;
      text-decoration: none !important;
      font-weight: 600 !important;
    }
    .pagefind-ui__result-link:hover {
      text-decoration: underline !important;
    }
  </style>
</head>
<body>

  <div class="search-container">
    <div class="nav-header">
      <h2>🔍 Global Curriculum Search</h2>
      <a href="index.html" class="btn-home">🏠 Dashboard Home</a>
    </div>

    <div id="search"></div>
  </div>

  <script>
    // 🛡️ DOM Guard: Ensures initialization script fires only after the elements are fully baked
    window.addEventListener('DOMContentLoaded', (event) => {
      if (typeof PagefindUI !== 'undefined') {
        new PagefindUI({
          element: "#search",
          showSubResults: true,
          resetStyles: false, // Allows our custom styles to mix nicely
          translations: {
            placeholder: "Search chapters, keywords, metrics, or technologies..."
          }
        });
      } else {
        document.getElementById('search').innerHTML = 
          "<p style='color: #ef4444; font-weight: 500;'>❌ Pagefind engine assets failed to load. Ensure your GitHub Actions build index pipeline has completed successfully.</p>";
      }
    });
  </script>

</body>
</html>
